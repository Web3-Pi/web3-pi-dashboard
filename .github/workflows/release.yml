name: Build and Release Dashboard

permissions:
  contents: write

on:
  push:
    tags:
      - "v*" # This will trigger on any tag that starts with v (e.g., v0.1.1, v1.2)

jobs:
  build-and-release:
    runs-on: ubuntu-24.04-arm

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: aarch64-unknown-linux-gnu

      - name: Build release binary
        run: |
          cargo build --release --bin w3p-hwm

      - name: Prepare release artifacts
        run: |
          mkdir web3-pi-dashboard-bin
          cp target/release/w3p-hwm web3-pi-dashboard-bin/w3p-hwm
          chmod +x web3-pi-dashboard-bin/w3p-hwm
          cp run.sh web3-pi-dashboard-bin/
          cp create_service.sh web3-pi-dashboard-bin/
          cp remove_service.sh web3-pi-dashboard-bin/
          cp -r font/ web3-pi-dashboard-bin/
          cp -r img/ web3-pi-dashboard-bin/
          zip -r web3-pi-dashboard-bin.zip web3-pi-dashboard-bin/

      - name: Create Release
        id: create_release
        uses: softprops/action-gh-release@v1
        with:
          files: web3-pi-dashboard-bin.zip
          name: Release ${{ github.ref_name }}
          body: |
            Web3 Pi Dashboard Release ${{ github.ref_name }}

            This release was automatically built and published by GitHub Actions.
          draft: false
          prerelease: false
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
